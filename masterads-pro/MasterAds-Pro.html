<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MasterAds Pro — Cockpit</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --border:#e3e6ea; --ink:#1a2330; --ink2:#5b6572; --ink3:#8a93a0;
    --accent:#1f5eff; --accent-soft:#eaf0ff;
    --good:#0e7a3d; --good-bg:#e7f5ec; --warn:#8a6100; --warn-bg:#fdf3d7; --bad:#b3261e; --bad-bg:#fbe9e7; --info:#155e75; --info-bg:#e0f2f7;
    --radius:10px; --shadow:0 1px 3px rgba(20,30,50,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;}
  #app{display:flex; min-height:100vh;}
  /* Sidebar */
  #sidebar{width:210px; background:#111827; color:#d3d9e2; padding:18px 12px; flex-shrink:0; display:flex; flex-direction:column;}
  #sidebar .brand{font-weight:800; font-size:16px; color:#fff; padding:6px 10px 18px; letter-spacing:.3px;}
  #sidebar .brand span{color:#7aa2ff;}
  #sidebar button.nav{display:block; width:100%; text-align:left; background:none; border:none; color:#c4cbd6; padding:10px 12px; border-radius:8px; font-size:14px; cursor:pointer; margin-bottom:2px;}
  #sidebar button.nav:hover{background:#1d2735; color:#fff;}
  #sidebar button.nav.active{background:#24334a; color:#fff; font-weight:600;}
  #sidebar .foot{margin-top:auto; font-size:11px; color:#6a7688; padding:10px 12px;}
  /* Main */
  #main{flex:1; padding:26px 32px; max-width:1160px;}
  h1{font-size:20px; margin-bottom:4px;}
  .sub{color:var(--ink2); margin-bottom:20px;}
  h2{font-size:15px; margin:22px 0 10px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:16px;}
  .row{display:flex; gap:14px; flex-wrap:wrap;}
  .tile{flex:1; min-width:150px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);}
  .tile .k{font-size:12px; color:var(--ink2); margin-bottom:2px;}
  .tile .v{font-size:22px; font-weight:700;}
  .tile .s{font-size:12px; color:var(--ink3);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--ink2); font-weight:600; padding:7px 8px; border-bottom:2px solid var(--border); white-space:nowrap;}
  td{padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top;}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  tr.total td{font-weight:700; border-top:2px solid var(--border);}
  .badge{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:700; white-space:nowrap;}
  .b-scale{background:var(--good-bg); color:var(--good);}
  .b-keep{background:var(--info-bg); color:var(--info);}
  .b-watch{background:var(--warn-bg); color:var(--warn);}
  .b-kill{background:var(--bad-bg); color:var(--bad);}
  .b-na{background:#eef0f3; color:var(--ink2);}
  .b-hot{background:var(--bad-bg); color:var(--bad);}
  .b-warm{background:var(--warn-bg); color:var(--warn);}
  .b-cold{background:var(--info-bg); color:var(--info);}
  .tag{display:inline-block; background:#eef0f3; color:var(--ink2); border-radius:6px; padding:1px 7px; font-size:11px; margin-right:4px;}
  button.btn{background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer;}
  button.btn:hover{filter:brightness(1.08);}
  button.btn2{background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer;}
  button.btn2:hover{background:#f0f2f5;}
  button.btn-sm{padding:3px 8px; font-size:12px;}
  button.danger{color:var(--bad); border-color:#f0c9c5;}
  input[type=text],input[type=number],input[type=email],input[type=date],input[type=password],select,textarea{
    width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:#fff; color:var(--ink); font-family:inherit;}
  textarea{min-height:70px; resize:vertical;}
  label{display:block; font-size:12px; font-weight:600; color:var(--ink2); margin:10px 0 4px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 16px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 16px;}
  .muted{color:var(--ink3); font-size:12.5px;}
  .empty{padding:30px; text-align:center; color:var(--ink3);}
  .toolbar{display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
  .toolbar .spacer{flex:1;}
  /* Kanban */
  .kanban{display:flex; gap:10px; overflow-x:auto; padding-bottom:8px;}
  .kcol{background:#eef0f3; border-radius:var(--radius); padding:10px; min-width:200px; width:200px; flex-shrink:0;}
  .kcol h3{font-size:12.5px; color:var(--ink2); margin-bottom:8px; text-transform:uppercase; letter-spacing:.4px;}
  .kcard{background:#fff; border:1px solid var(--border); border-radius:8px; padding:9px 10px; margin-bottom:8px; cursor:pointer; box-shadow:var(--shadow);}
  .kcard .nm{font-weight:600; font-size:13px;}
  .kcard .mv{display:flex; gap:4px; margin-top:6px;}
  /* Modal */
  #modalWrap{position:fixed; inset:0; background:rgba(15,20,30,.45); display:none; align-items:flex-start; justify-content:center; z-index:50; overflow:auto; padding:40px 16px;}
  #modalWrap.open{display:flex;}
  #modal{background:#fff; border-radius:12px; padding:22px 24px; width:640px; max-width:100%; box-shadow:0 10px 40px rgba(0,0,0,.25);}
  #modal h2{margin-top:0;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:18px;}
  /* Toast */
  #toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1a2330; color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; display:none; z-index:99; max-width:80%;}
  /* AI output */
  .ai-out{background:#fafbfc; border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-top:10px; font-size:13.5px;}
  .ai-out h3{font-size:14px; margin:12px 0 6px;} .ai-out h3:first-child{margin-top:0;}
  .ai-out h4{font-size:13px; margin:10px 0 4px;}
  .ai-out ul{margin:4px 0 8px 18px;}
  .ai-out p{margin:6px 0;}
  .spin{display:inline-block; width:14px; height:14px; border:2px solid #cdd4dd; border-top-color:var(--accent); border-radius:50%; animation:sp 0.8s linear infinite; vertical-align:-2px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  details.play{margin-bottom:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px;}
  details.play summary{font-weight:700; cursor:pointer; font-size:13.5px;}
  details.play .bd{margin-top:8px; font-size:13px; color:var(--ink2);}
  details.play .bd b{color:var(--ink);}
  /* Report */
  #reportView{display:none; position:fixed; inset:0; background:#fff; z-index:60; overflow:auto; padding:36px 48px;}
  #reportView.open{display:block;}
  #reportView .rep-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid var(--ink); padding-bottom:14px; margin-bottom:20px;}
  #reportView .rep-brand{font-size:22px; font-weight:800;}
  #reportView h2{font-size:16px; margin:20px 0 8px;}
  .noprint{}
  @media print{
    body>#app, #modalWrap, #toast{display:none !important;}
    #reportView{position:static; padding:0;}
    .noprint{display:none !important;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="brand">MasterAds <span>Pro</span></div>
    <button class="nav" data-view="dashboard">📊 Dashboard</button>
    <button class="nav" data-view="clients">👥 Clients</button>
    <button class="nav" data-view="ads">📈 Ads Analysis</button>
    <button class="nav" data-view="crm">🗂 CRM Pipeline</button>
    <button class="nav" data-view="strategy">🧭 Strategy</button>
    <button class="nav" data-view="prospection">🎯 Prospection</button>
    <button class="nav" data-view="settings">⚙️ Settings</button>
    <div class="foot">Your data stays in this browser.<br>Back it up in Settings.</div>
  </div>
  <div id="main"></div>
</div>
<div id="modalWrap"><div id="modal"></div></div>
<div id="reportView"></div>
<div id="toast"></div>

<script>
'use strict';
/* ============================= STATE ============================= */
const LS_KEY = 'masterads_pro_v1';
const STAGES = ['New','Contacted','Qualified','Proposal','Won','Lost'];
const PSTAGES = ['To contact','Contacted','In discussion','Proposal sent','Won','Lost'];
const defaultState = () => ({
  settings:{ businessName:'MasterAds Pro', ownerName:'', email:'', phone:'', apiKey:'', model:'claude-opus-4-8' },
  clients:[], campaigns:[], leads:[], prospects:[], strategies:{}, aiAds:{}
});
let state = load();
function load(){ try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const s = JSON.parse(raw); return Object.assign(defaultState(), s); } }catch(e){} return defaultState(); }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ============================= UTILS ============================= */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, ms=2600){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms); }
function clientById(id){ return state.clients.find(c=>c.id===id); }
function clientName(id){ const c=clientById(id); return c?c.name:'—'; }

function parseNum(v){
  if(v==null) return NaN;
  if(typeof v==='number') return v;
  let s = String(v).trim().replace(/[€$£]|MAD|DH|USD|EUR/gi,'').replace(/[\s  ']/g,'');
  if(!s || s==='--' || s==='—') return NaN;
  const hasC = s.includes(','), hasD = s.includes('.');
  if(hasC && hasD){
    // last separator is the decimal one
    if(s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',', '.');
    else s = s.replace(/,/g,'');
  } else if(hasC){
    const after = s.split(',').pop();
    if(after.length===3) s = s.replace(/,/g,'');   // "8,000" → 8000 (thousands)
    else s = s.replace(',', '.');                   // "53,33" → 53.33 (decimal)
  }
  const n = parseFloat(s);
  return isNaN(n)?NaN:n;
}
function fmtNum(v, dec=0){
  if(v==null || !isFinite(v)) return '—';
  const n = v.toFixed(dec); let [i,d] = n.split('.');
  const neg = i.startsWith('-'); if(neg) i=i.slice(1);
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (neg?'-':'')+i+(d?','+d:'');
}
function fmtMoney(v, cur){
  if(v==null || !isFinite(v)) return '—';
  const dec = Math.abs(v % 1) > 0.004 ? 2 : 0;
  if(cur==='USD'){
    const n=v.toFixed(dec); let[i,d]=n.split('.'); const neg=i.startsWith('-'); if(neg)i=i.slice(1);
    i=i.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return (neg?'-':'')+'$'+i+(d?'.'+d:'');
  }
  return fmtNum(v,dec)+' '+(cur==='EUR'?'€':(cur||'MAD'));
}
function fmtPct(v, dec=1){ return (v==null||!isFinite(v))?'—':fmtNum(v,dec)+'%'; }

/* ============================= CSV ============================= */
function parseCSV(text){
  const rows=[]; let row=[], field='', inQ=false;
  text = String(text).replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; }
      else field+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* skip */ }
      else field+=c;
    }
  }
  if(field!=='' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
const ADS_HEADER_TOKENS = ['campaign','amount spent','impressions','impr','clicks','results','conversions','cost','spend'];
function findHeaderRow(rows){
  for(let i=0;i<Math.min(rows.length,10);i++){
    const cells = rows[i].map(c=>String(c).toLowerCase().trim());
    if(cells.length<2) continue;
    const hits = cells.filter(c=>ADS_HEADER_TOKENS.some(t=>c.includes(t))).length;
    if(hits>=2) return i;
  }
  return -1;
}
function detectPlatform(headers){
  const h = headers.map(x=>String(x).toLowerCase());
  if(h.some(x=>x.includes('amount spent') || x.includes('link clicks') || x.includes('reach'))) return 'meta';
  if(h.some(x=>x==='impr.' || x==='impr') || (h.includes('cost') && h.includes('campaign'))) return 'google';
  return 'other';
}
function autoMap(headers){
  const h = headers.map(x=>String(x).toLowerCase().trim());
  const find = (...preds) => { for(const p of preds){ const i = h.findIndex(p); if(i>=0) return i; } return -1; };
  return {
    name: find(x=>x==='campaign name', x=>x==='campaign', x=>x.includes('campaign name'), x=>x.includes('campaign')),
    spend: find(x=>x.startsWith('amount spent'), x=>x==='cost', x=>x==='spend', x=>x.includes('spent'), x=>x.includes('cost')),
    impressions: find(x=>x==='impressions', x=>x==='impr.', x=>x==='impr', x=>x.includes('impression')),
    clicks: find(x=>x==='link clicks', x=>x==='clicks', x=>x.includes('link click'), x=>x==='clicks (all)', x=>x.includes('click')),
    results: find(x=>x==='results', x=>x==='conversions', x=>x==='leads', x=>x.includes('result'), x=>x.includes('conversion')),
    revenue: find(x=>x.includes('purchase value')||x.includes('conversion value')||x==='conv. value'||x.includes('revenue'))
  };
}
const LEAD_HEADER_MAP = {
  name:['full_name','full name','name','nom','lead name'],
  phone:['phone_number','phone','téléphone','telephone','tel','whatsapp'],
  email:['email','e-mail','mail','adresse email'],
  source:['campaign_name','campaign','source','form_name','ad_name','origine'],
  date:['created_time','created','date','submitted']
};
function autoMapLeads(headers){
  const h = headers.map(x=>String(x).toLowerCase().trim());
  const out={};
  for(const [k, aliases] of Object.entries(LEAD_HEADER_MAP)){
    out[k] = h.findIndex(x=>aliases.some(a=>x===a || x.includes(a)));
  }
  return out;
}

/* ============================= METRICS & VERDICTS ============================= */
function metrics(c){
  const spend=+c.spend||0, imp=+c.impressions||0, clk=+c.clicks||0, res=+c.results||0, rev=+c.revenue||0;
  return {
    spend, impressions:imp, clicks:clk, results:res, revenue:rev,
    cpm: imp>0 ? spend/imp*1000 : NaN,
    ctr: imp>0 ? clk/imp*100 : NaN,
    cpc: clk>0 ? spend/clk : NaN,
    cpl: res>0 ? spend/res : NaN,
    roas: (rev>0 && spend>0) ? rev/spend : NaN
  };
}
function verdictFor(c, target){
  const m = metrics(c);
  if(!target || !isFinite(target) || target<=0) return {code:'na', label:'SET TARGET', reason:'Set a target CPA/CPL on the client to get verdicts.'};
  if(m.results===0){
    if(m.spend >= 2*target) return {code:'kill', label:'KILL', reason:'No results with spend over 2× your target — stop or rebuild this campaign.'};
    return {code:'watch', label:'WATCH', reason:'No results yet, but spend is still below 2× target. Give it a little more data.'};
  }
  const r = m.cpl/target;
  if(r <= 0.8) return {code:'scale', label:'SCALE', reason:`CPL ${Math.round(r*100)}% of target — increase budget gradually (+20-30% steps).`};
  if(r <= 1.1) return {code:'keep', label:'KEEP', reason:'CPL around target — keep running, test creatives to push it down.'};
  if(r <= 1.5) return {code:'watch', label:'WATCH', reason:'CPL above target — refresh creatives / tighten audience before scaling anything.'};
  return {code:'kill', label:'KILL', reason:`CPL ${Math.round(r*100)}% of target — cut it or rebuild with a new angle.`};
}
function diagnostics(c){
  const m = metrics(c), hints=[];
  if(isFinite(m.ctr) && m.ctr < 1) hints.push('Low CTR (<1%) → creative/hook problem more than targeting.');
  if(isFinite(m.ctr) && m.ctr >= 3 && isFinite(m.cpl)) hints.push('Strong CTR — if CPL is high, the leak is after the click (landing page / form / offer).');
  if(m.results===0 && m.clicks>50) hints.push('Clicks but zero results → check pixel/conversion tracking and the landing page.');
  return hints;
}
function scoreLead(l){
  let s=0;
  if(l.phone) s+=35;
  if(l.email) s+=20;
  if(l.notes && l.notes.trim().length>10) s+=15;
  if(l.source) s+=10;
  const ageDays = (Date.now() - new Date(l.createdAt||Date.now()).getTime())/86400000;
  if(ageDays<=2) s+=20; else if(ageDays<=7) s+=10;
  return Math.min(100,s);
}
function leadHeat(score){ return score>=70?{cls:'b-hot',label:'HOT'}:score>=40?{cls:'b-warm',label:'WARM'}:{cls:'b-cold',label:'COLD'}; }

/* ============================= MARKDOWN-ISH RENDER ============================= */
function mdToHtml(md){
  const lines = String(md||'').split('\n'); let html='', inList=false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)\*([^*]+)\*/g,'$1<i>$2</i>');
  for(const raw of lines){
    const line = raw.trimEnd();
    if(/^\s*[-*•] /.test(line)){ if(!inList){html+='<ul>';inList=true;} html+='<li>'+inline(line.replace(/^\s*[-*•] /,''))+'</li>'; continue; }
    if(inList){ html+='</ul>'; inList=false; }
    if(/^#{3,}\s/.test(line)) html+='<h4>'+inline(line.replace(/^#+\s/,''))+'</h4>';
    else if(/^##\s/.test(line)) html+='<h3>'+inline(line.replace(/^#+\s/,''))+'</h3>';
    else if(/^#\s/.test(line)) html+='<h3>'+inline(line.replace(/^#+\s/,''))+'</h3>';
    else if(line==='') html+='';
    else html+='<p>'+inline(line)+'</p>';
  }
  if(inList) html+='</ul>';
  return html;
}

/* ============================= CLAUDE API ============================= */
async function aiCall(system, user, maxTokens=4000){
  const key = state.settings.apiKey;
  if(!key) throw new Error('NO_KEY');
  const resp = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      'content-type':'application/json',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({ model: state.settings.model||'claude-opus-4-8', max_tokens:maxTokens, system, messages:[{role:'user',content:user}] })
  });
  if(!resp.ok){
    let msg = 'API error '+resp.status;
    try{ const j=await resp.json(); if(j.error&&j.error.message) msg=j.error.message; }catch(e){}
    if(resp.status===401) msg='Invalid API key — check Settings.';
    throw new Error(msg);
  }
  const data = await resp.json();
  if(data.stop_reason==='refusal') throw new Error('The AI declined this request.');
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
function aiGuard(){ if(!state.settings.apiKey){ toast('Add your Anthropic API key in Settings to unlock AI features.'); route('settings'); return false; } return true; }
function bizContext(){
  const s=state.settings;
  return `You are the senior strategist of "${s.businessName||'MasterAds Pro'}", a digital marketing & media buying agency${s.ownerName?(' run by '+s.ownerName):''} working with Moroccan and international clients (currencies: MAD, EUR, USD). Be concrete, practical and concise. Use plain markdown (## headers, bullet lists, **bold**). No preamble.`;
}

/* ============================= ROUTING ============================= */
let currentView='dashboard';
function route(v){
  currentView=v;
  document.querySelectorAll('#sidebar .nav').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  const main=document.getElementById('main');
  const R={dashboard:renderDashboard, clients:renderClients, ads:renderAds, crm:renderCRM, strategy:renderStrategy, prospection:renderProspection, settings:renderSettings};
  main.innerHTML=''; (R[v]||renderDashboard)(main);
}
document.querySelectorAll('#sidebar .nav').forEach(b=>b.addEventListener('click',()=>route(b.dataset.view)));

/* ============================= MODAL ============================= */
function openModal(html){ document.getElementById('modal').innerHTML=html; document.getElementById('modalWrap').classList.add('open'); }
function closeModal(){ document.getElementById('modalWrap').classList.remove('open'); }
document.getElementById('modalWrap').addEventListener('click', e=>{ if(e.target.id==='modalWrap') closeModal(); });

/* ============================= DASHBOARD ============================= */
function renderDashboard(el){
  const now=Date.now(), d30=now-30*86400000, d7=now-7*86400000;
  const spendByCur={};
  state.campaigns.forEach(c=>{ const cl=clientById(c.clientId); const cur=cl?cl.currency:'MAD'; spendByCur[cur]=(spendByCur[cur]||0)+(+c.spend||0); });
  const leads7 = state.leads.filter(l=>new Date(l.createdAt).getTime()>=d7).length;
  const followupsDue = state.leads.filter(l=>l.nextFollowUp && l.nextFollowUp<=todayISO() && !['Won','Lost'].includes(l.stage));
  const prospActions = state.prospects.filter(p=>p.nextActionDate && p.nextActionDate<=todayISO() && !['Won','Lost'].includes(p.status));
  const openLeads = state.leads.filter(l=>!['Won','Lost'].includes(l.stage)).length;
  const spendStr = Object.keys(spendByCur).length? Object.entries(spendByCur).map(([c,v])=>fmtMoney(v,c)).join(' + ') : '—';

let pendingImport=null;
function importAdsModal(){
  if(!state.clients.length){ toast('Add a client first.'); route('clients'); return; }
  openModal(`<h2>Import ads CSV</h2>
    <p class="muted">Export from <b>Meta Ads Manager</b> (Campaigns → Export → CSV) or <b>Google Ads</b> (Campaigns → Download → CSV), then drop the file here. Columns are detected automatically.</p>

    <label>CSV file</label><input type="file" id="impFile" accept=".csv,text/csv">
    <div id="impPreview"></div>
    <div class="modal-actions"><button class="btn2" onclick="closeModal()">Cancel</button><button class="btn" id="btnDoImport" onclick="confirmImport()" disabled>Import</button></div>`);
  document.getElementById('impFile').addEventListener('change', e=>{
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=()=>previewImport(String(reader.result));
    reader.readAsText(f);
  });
}
function previewImport(text){
  const rows=parseCSV(text);
  const hi=findHeaderRow(rows);
  const box=document.getElementById('impPreview');
  if(hi<0){ box.innerHTML='<p class="muted" style="color:var(--bad)">Could not find a header row with campaign columns in this file.</p>'; return; }
  const headers=rows[hi];
  const map=autoMap(headers);
  const platform=detectPlatform(headers);
  const dataRows=rows.slice(hi+1).filter(r=>{
    const nm=(r[map.name]||'').toString().trim();
    return nm && !/^total/i.test(nm) && isFinite(parseNum(r[map.spend]));
  });
  pendingImport={headers, map, platform, dataRows};
  const selHtml = (field)=>`<select data-map="${field}" onchange="pendingImport.map['${field}']=parseInt(this.value)">${['<option value="-1">—</option>'].concat(headers.map((h,i)=>`<option value="${i}" ${map[field]===i?'selected':''}>${esc(h)}</option>`)).join('')}</select>`;
  box.innerHTML=`<p style="margin:10px 0 4px"><b>Detected platform:</b> ${platform==='meta'?'Meta':platform==='google'?'Google Ads':'Other'} · <b>${dataRows.length}</b> campaigns found</p>
    <div class="grid3">
      <div><label>Campaign name</label>${selHtml('name')}</div>
      <div><label>Spend</label>${selHtml('spend')}</div>
      <div><label>Impressions</label>${selHtml('impressions')}</div>
      <div><label>Clicks</label>${selHtml('clicks')}</div>
      <div><label>Results</label>${selHtml('results')}</div>
      <div><label>Revenue</label>${selHtml('revenue')}</div>
    </div>
    <div style="max-height:180px;overflow:auto;margin-top:10px"><table><thead><tr><th>Campaign</th><th class="num">Spend</th><th class="num">Impr.</th><th class="num">Clicks</th><th class="num">Results</th></tr></thead><tbody>
    ${dataRows.slice(0,8).map(r=>`<tr><td>${esc(r[map.name])}</td><td class="num">${esc(r[map.spend])}</td><td class="num">${esc(r[map.impressions]||'')}</td><td class="num">${esc(r[map.clicks]||'')}</td><td class="num">${esc(r[map.results]||'')}</td></tr>`).join('')}
    </tbody></table></div>`;
  document.getElementById('btnDoImport').disabled = dataRows.length===0;
}
function confirmImport(){
  if(!pendingImport) return;
  const clientId=document.getElementById('impClient').value;
  const period=document.getElementById('impPeriod').value.trim();
  const {map, platform, dataRows}=pendingImport;
  let n=0;
  for(const r of dataRows){
    const get=i=> i>=0? r[i]:'';
    state.campaigns.push({ id:uid(), clientId, platform, name:String(get(map.name)).trim(), period,
      spend:parseNum(get(map.spend))||0, impressions:parseNum(get(map.impressions))||0, clicks:parseNum(get(map.clicks))||0,
      results:parseNum(get(map.results))||0, revenue:parseNum(get(map.revenue))||0, importedAt:new Date().toISOString() });
    n++;
  }
  pendingImport=null; save(); closeModal(); adsClientFilter=clientId; route('ads'); toast(n+' campaigns imported.');
}
async function runAiAds(clientId){
  if(!aiGuard()) return;

  const lines=list.map(c=>{const m=metrics(c); return `- [${c.platform}] "${c.name}": spend ${m.spend} ${cur}, impressions ${m.impressions}, clicks ${m.clicks}, CTR ${isFinite(m.ctr)?m.ctr.toFixed(2):'n/a'}%, results ${m.results}, CPA/CPL ${isFinite(m.cpl)?m.cpl.toFixed(2):'n/a'} ${cur}${m.roas?`, ROAS ${m.roas.toFixed(2)}`:''}`;}).join('\n');
  const btn=document.getElementById('btnAiAds'); if(btn){btn.disabled=true; btn.innerHTML='<span class="spin"></span> Analyzing…';}

`Analyze this client's ad account and give optimization decisions.

Give me:

  (l.history=l.history||[]).push({at:new Date().toISOString(), event:'Moved to '+l.stage});

let pendingLeadImport=null;
function previewLeadImport(text){
  const rows=parseCSV(text);
  if(rows.length<2){ document.getElementById('limpPreview').innerHTML='<p class="muted" style="color:var(--bad)">File looks empty.</p>'; return; }
  const headers=rows[0]; const map=autoMapLeads(headers);
  const dataRows=rows.slice(1).filter(r=>map.name>=0 && String(r[map.name]||'').trim());
  pendingLeadImport={headers,map,dataRows};
  document.getElementById('limpPreview').innerHTML=`<p style="margin:10px 0 4px"><b>${dataRows.length}</b> leads found</p>
    <div style="max-height:160px;overflow:auto"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Source</th></tr></thead><tbody>
    ${dataRows.slice(0,8).map(r=>`<tr><td>${esc(r[map.name])}</td><td>${esc(map.phone>=0?r[map.phone]:'')}</td><td>${esc(map.email>=0?r[map.email]:'')}</td><td>${esc(map.source>=0?r[map.source]:'')}</td></tr>`).join('')}</tbody></table></div>`;
  document.getElementById('btnDoLeadImport').disabled=dataRows.length===0;
}
function confirmLeadImport(){
  if(!pendingLeadImport) return;
  const clientId=document.getElementById('limpClient').value;
  const {map,dataRows}=pendingLeadImport;
  let n=0, skipped=0;
  for(const r of dataRows){
    const name=String(r[map.name]).trim();
    const phone=map.phone>=0?String(r[map.phone]||'').trim():'';
    const email=map.email>=0?String(r[map.email]||'').trim():'';
    const dup = state.leads.some(l=> (phone && l.phone===phone) || (email && l.email && l.email===email));
    if(dup){ skipped++; continue; }
    state.leads.push({ id:uid(), clientId, name, phone, email,
      source: map.source>=0?String(r[map.source]||'').trim():'',
      stage:'New', notes:'', nextFollowUp: todayISO(), createdAt: new Date().toISOString(), history:[] });
    n++;
  }
  pendingLeadImport=null; save(); closeModal(); route('crm');
  toast(n+' leads imported'+(skipped?(' · '+skipped+' duplicates skipped'):'')+'. Follow-up set to today.');
}
function exportLeadsCSV(){
  const rows=[['Name','Client','Phone','Email','Source','Stage','Score','Next follow-up','Notes','Created']];
  state.leads.forEach(l=>rows.push([l.name,clientName(l.clientId),l.phone||'',l.email||'',l.source||'',l.stage,scoreLead(l),l.nextFollowUp||'',(l.notes||'').replace(/\n/g,' '),(l.createdAt||'').slice(0,10)]));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  download('masterads-leads-'+todayISO()+'.csv', csv, 'text/csv');
}

    One-page sites: "Ads pour dentistes à Casablanca", "Google Ads pour écoles privées à Rabat"… with one case study + WhatsApp button. Cheap Google Search campaigns on "agence publicité + [niche/ville]" bring pre-qualified inbound leads. You're a media buyer — be your own best case study.</div></details>
  <details class="play"><summary>7. Partner channel: web designers & freelancers</summary><div class="bd">
    Web designers finish a site and their client immediately asks "how do I get traffic?" — that's your lead. Offer designers 10-15% recurring referral fee. 5 active partners ≈ a steady lead stream with zero ad spend.</div></details>`;
}
function editProspect(id){
  const p=id? state.prospects.find(x=>x.id===id) : {channel:'LinkedIn', status:'To contact'};
  openModal(`<h2>${id?'Edit':'Add'} prospect</h2>
    <div class="grid2">
      <div><label>Name *</label><input type="text" id="pName" value="${esc(p.name||'')}"></div>
      <div><label>Company</label><input type="text" id="pCompany" value="${esc(p.company||'')}"></div>
      <div><label>Channel</label><select id="pChannel">${['LinkedIn','Cold email','WhatsApp','Instagram DM','Referral','Ad Library sniping','Other'].map(x=>`<option ${p.channel===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div><label>Status</label><select id="pStatus">${PSTAGES.map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div><label>Next action</label><input type="text" id="pAction" value="${esc(p.nextAction||'')}" placeholder="e.g. Send teardown DM"></div>
      <div><label>Due date</label><input type="date" id="pDate" value="${esc(p.nextActionDate||'')}"></div>
    </div>
    <label>Notes / what you observed (their ads, their site, pain points…)</label><textarea id="pNotes">${esc(p.notes||'')}</textarea>
    <div class="modal-actions"><button class="btn2" onclick="closeModal()">Cancel</button><button class="btn" id="btnSaveProspect" onclick="saveProspect('${id||''}')">Save</button></div>`);
}
function saveProspect(id){
  const name=document.getElementById('pName').value.trim();
  if(!name){ toast('Name is required.'); return; }
  const data={ name, company:document.getElementById('pCompany').value.trim(), channel:document.getElementById('pChannel').value,
    status:document.getElementById('pStatus').value, nextAction:document.getElementById('pAction').value.trim(),
    nextActionDate:document.getElementById('pDate').value, notes:document.getElementById('pNotes').value };
  if(id) Object.assign(state.prospects.find(x=>x.id===id), data);
  else state.prospects.push(Object.assign({id:uid(), createdAt:new Date().toISOString(), outreach:''}, data));
  save(); closeModal(); route('prospection'); toast('Prospect saved.');
}
function delProspect(id){ if(!confirm('Delete this prospect?'))return; state.prospects=state.prospects.filter(p=>p.id!==id); save(); route('prospection'); }
function openProspect(id){
  const p=state.prospects.find(x=>x.id===id); if(!p) return;
  openModal(`<h2>${esc(p.name)} <span class="tag">${esc(p.company||'')}</span></h2>
    <p class="muted">${esc(p.channel)} · ${esc(p.status)}</p>
    <label>Notes</label><textarea id="poNotes">${esc(p.notes||'')}</textarea>
    <div class="grid2">
      <div><label>Status</label><select id="poStatus">${PSTAGES.map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div><label>Next action date</label><input type="date" id="poDate" value="${esc(p.nextActionDate||'')}"></div>
    </div>
    <label>Next action</label><input type="text" id="poAction" value="${esc(p.nextAction||'')}">
    <div style="margin-top:10px"><button class="btn" id="btnOutreach" onclick="genOutreach('${p.id}')">✨ Write outreach (DM + email)</button></div>
    <div id="poOut">${p.outreach?`<div class="ai-out">${mdToHtml(p.outreach)}</div>`:''}</div>
    <div class="modal-actions"><button class="btn2" onclick="closeModal()">Close</button><button class="btn" onclick="saveProspectDetail('${p.id}')">Save</button></div>`);
}
function saveProspectDetail(id){
  const p=state.prospects.find(x=>x.id===id); if(!p) return;
  p.notes=document.getElementById('poNotes').value; p.status=document.getElementById('poStatus').value;
  p.nextActionDate=document.getElementById('poDate').value; p.nextAction=document.getElementById('poAction').value;
  save(); closeModal(); route('prospection'); toast('Prospect updated.');
}
function genOutreach(id){
  const p=state.prospects.find(x=>x.id===id); if(!p) return;
  const offline=()=>{
    const first=p.name.split(' ')[0];
    p.outreach=`## LinkedIn DM\nHello ${first} — I checked ${p.company||'your business'}${p.notes?` and noticed: ${p.notes.slice(0,120)}`:"'s ads"}. I run paid ads for businesses like yours (${state.settings.businessName||'MasterAds Pro'}). I recorded 2 quick improvements that would lower your cost per lead — want me to send them? No strings attached.\n\n## Cold email\n**Subject:** 2 things costing ${p.company||'you'} money in your ads\n\nHello ${first},\n\nI analyze ad accounts in your sector every week. Looking at ${p.company||'your business'}, I spotted 2 concrete issues (creative + targeting) that typically inflate cost per lead by 30-50%.\n\nI'd be happy to send you the 2 fixes — free, no call required. If they make sense, we can talk about me running it for you.\n\n${state.settings.ownerName||state.settings.businessName||''}`;
    save(); openProspect(id);
  };
  if(!state.settings.apiKey){ offline(); toast('Template outreach generated (add an API key for AI-personalized ones).'); return; }
  const btn=document.getElementById('btnOutreach'); if(btn){btn.disabled=true; btn.innerHTML='<span class="spin"></span> Writing…';}
  aiCall(bizContext(), `Write outreach for this prospect of my agency. Channel: ${p.channel}.
Prospect: ${p.name}${p.company?', company: '+p.company:''}. My observations: ${p.notes||'none — keep it curiosity-based'}.
Write:
## LinkedIn DM
Max 60 words, references the observation, offers a free specific teardown, zero pressure. French if the prospect seems Moroccan/French-speaking, else English.
## Cold email
Subject + max 110 words, same angle, one clear low-friction CTA.
## Follow-up (3 days later)
Max 30 words, light.`, 1200)
  .then(out=>{ p.outreach=out; save(); openProspect(id); })
  .catch(e=>{ toast('AI error: '+e.message,5000); offline(); });
}

/* ============================= SETTINGS ============================= */
function renderSettings(el){
  const s=state.settings;
  el.innerHTML=`<h1>Settings</h1><div class="sub">Your business identity, AI key, and data backups.</div>
  <div class="card"><h2 style="margin-top:0">Business</h2>
    <div class="grid2">
      <div><label>Business name (shown on reports)</label><input type="text" id="setBiz" value="${esc(s.businessName)}"></div>
      <div><label>Your name</label><input type="text" id="setOwner" value="${esc(s.ownerName)}"></div>
      <div><label>Email</label><input type="email" id="setEmail" value="${esc(s.email)}"></div>
      <div><label>Phone</label><input type="text" id="setPhone" value="${esc(s.phone)}"></div>
    </div></div>
  <div class="card"><h2 style="margin-top:0">AI (Claude API)</h2>
    <p class="muted">AI features (analysis narratives, strategy generation, outreach & qualification) use your own Anthropic API key, stored <b>only in this browser</b>. Get one at <a href="https://platform.claude.com" target="_blank" rel="noopener">platform.claude.com</a>. Each request sends only the relevant text to the API. Without a key, everything else still works (rule-based verdicts + templates).</p>
    <div class="grid2">
      <div><label>Anthropic API key</label><input type="password" id="setKey" value="${esc(s.apiKey)}" placeholder="sk-ant-..."></div>
      <div><label>Model</label><select id="setModel">${[['claude-opus-4-8','Claude Opus 4.8 (best, default)'],['claude-sonnet-5','Claude Sonnet 5 (cheaper)'],['claude-haiku-4-5','Claude Haiku 4.5 (cheapest)']].map(([v,l])=>`<option value="${v}" ${s.model===v?'selected':''}>${l}</option>`).join('')}</select></div>
    </div>
    <div style="margin-top:10px"><button class="btn2" id="btnTestKey" onclick="testKey()">Test key</button> <span id="keyTestOut" class="muted"></span></div>
  </div>
  <div class="card"><h2 style="margin-top:0">Data</h2>
    <p class="muted">Everything lives in this browser's storage. Export a backup regularly (it's a single JSON file).</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap">
      <button class="btn" id="btnExport" onclick="exportBackup()">⬇ Export backup (JSON)</button>
      <button class="btn2" onclick="document.getElementById('importBackupFile').click()">⬆ Import backup</button>
      <input type="file" id="importBackupFile" accept=".json,application/json" style="display:none">
      <button class="btn2 danger" onclick="wipeData()">🗑 Erase all data</button>
    </div>
  </div>
  <div style="margin-top:8px"><button class="btn" id="btnSaveSettings" onclick="saveSettings()">Save settings</button></div>`;
  document.getElementById('importBackupFile').addEventListener('change', e=>{
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=()=>{ try{ const j=JSON.parse(String(reader.result));
        if(!j || typeof j!=='object' || !('clients' in j)){ toast('This does not look like a MasterAds Pro backup.'); return; }
        state=Object.assign(defaultState(), j); save(); route('dashboard'); toast('Backup imported.');
      }catch(err){ toast('Invalid JSON file.'); } };
    reader.readAsText(f);
  });
}
function saveSettings(){
  const s=state.settings;
  s.businessName=document.getElementById('setBiz').value.trim()||'MasterAds Pro';
  s.ownerName=document.getElementById('setOwner').value.trim();
  s.email=document.getElementById('setEmail').value.trim();
  s.phone=document.getElementById('setPhone').value.trim();
  s.apiKey=document.getElementById('setKey').value.trim();
  s.model=document.getElementById('setModel').value;
  save(); toast('Settings saved.');
}
async function testKey(){
  saveSettings();
  const out=document.getElementById('keyTestOut');
  if(!state.settings.apiKey){ out.textContent='No key entered.'; return; }
  out.innerHTML='<span class="spin"></span> testing…';
  try{ await aiCall('You are a health check.', 'Reply with exactly: OK', 16); out.textContent='✅ Key works.'; }
  catch(e){ out.textContent='❌ '+e.message; }
}
function download(name, content, mime){
  const blob=new Blob([content],{type:mime||'application/octet-stream'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function exportBackup(){ download('masterads-backup-'+todayISO()+'.json', JSON.stringify(state,null,2), 'application/json'); }
function wipeData(){ if(!confirm('Erase ALL data in this browser? Export a backup first!'))return; localStorage.removeItem(LS_KEY); state=defaultState(); route('dashboard'); toast('All data erased.'); }
